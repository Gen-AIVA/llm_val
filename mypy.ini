[mypy]
python_version = 3.10

# "Документация", 3
# "Необходимо соблюдать типизацию при передаче аргументов в функции/методы и при выходе из функции (return)".
# Запрещает определять функции без аннотаций типов аргументов и возвращаемого значения.
disallow_untyped_defs = True

# "Документация", 3
# Запрещает частично аннотированные функции (например, если аннотирована только часть параметров).
disallow_incomplete_defs = True

# отключает проверку доступа к атрибутам у Optional-типов
disable_error_code = union-attr,arg-type

# "Специальные правила написания кода", 7
# Запрещает использование обобщённых классов без указания типов-параметров (например, list вместо List[int]),
# что заставляет явно прописывать конкретные типы, включая Union и Optional.
disallow_any_generics = True

# "Специальные правила написания кода", 7
# Если переменная может быть None, то используется tp.Optional[тип данных переменной]".
# Запрещает неявную передачу None в параметры, не объявленные как Optional, вынуждая явно указывать Optional.
no_implicit_optional = True


# Гигиена кода: соответствие общему принципу отсутствия мёртвого/неиспользуемого кода.
# Заставляет убирать избыточные комментарии # type: ignore, если ошибка больше не возникает.
warn_unused_ignores = True

# Нижеследующие настройки позволяют работать с библиотеками, не имеющими полной статической типизации (pandas, numpy),
# чтобы избежать ложных ошибок, не нарушая основных требований к аннотациям в коде тестов.
[mypy-pandas.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True
