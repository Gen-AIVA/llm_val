[tool.ruff]
# Настройки форматирования и общая цель
line-length = 120        # "Общие правила написания кода", 1. PEP8
target-version = "py310"

[tool.ruff.format]
# Задаём единый стиль – одинарные кавычки
quote-style = "single"

[tool.ruff.lint]
select = [
    # "Общие правила написания кода", 1. 
    # Базовые правила PEP8 (стиль, ошибки, потенциальные проблемы)
    # правила именования, пробелы, пустые строки между функциями и т.д.
    "E", "F", "W",

    # "Документация", 1
    # Исключения для модуля и __init__ заданы в ignore.
    "D",

    # "Общие правила написания кода", 16
    # flake8-bugbear: выявление типовых ошибок и подозрительных конструкций
    # B006 запрещает использовать мутабельные объекты как значения по умолчанию,
    # Также ловим бесполезные выражения, неиспользуемые переменные цикла и т.д.
    "B",

    # "Общие правила написания кода", 9
    # mccabe: ограничение цикломатической сложности
    "C90",

    # "Общие правила написания кода", 10
    # flake8-simplify: упрощение конструкций
    # (правила типа SIM108 заменяют if-else на тернарный оператор).
    "SIM",
    
    # "Unit-тестирование"
    # flake8-pytest-style: стиль тестов на pytest
    "PT",

    "Q"          # flake8-quotes
]

ignore = [
    # Разрешаем не писать докстринги уровня модуля
    "D100",
    # Разрешаем не писать докстринги в __init__.py
    "D104",
    # Отключаем требование пустой строки между заголовком и телом докстринга (конфликт с автоформатированием)
    "D205",
    # Отключаем требование завершающей пунктуации в первой строке докстринга (конфликт с автоформатированием)
    "D415",
    # отключаем проверку многострочных кавычек (ограничение форматтера)
    "Q001"
]

[tool.ruff.lint.mccabe]
# "Общие правила написания кода", 9
# Средняя сложность 4-5 соответствует 3 уровням вложенности с условиями; значение 7 даёт запас.
max-complexity = 7

[tool.ruff.lint.pydocstyle]
# Cтиль докстрингов (пример соответствует Google стилю)
convention = "google"

[tool.ruff.lint.isort]
# "Общие правила написания кода", 21
lines-between-types = 1

[tool.ruff.lint.flake8-quotes]
# Существующие настройки плагина:
inline-quotes = "single"        # '...'
multiline-quotes = "single"     # '''...'''
docstring-quotes = "double"     # """...""" (оставляем двойные, если нужны)
avoid-escape = true             # разрешать двойные, если внутри строки есть '
